name: Release 26.3 true bold fontfix v1

on:
  push:
    branches:
      - update-26.3
    paths:
      - .github/workflows/release-fontfix-truebold-v1.yml

permissions:
  contents: write

jobs:
  build-commit-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: update-26.3
          fetch-depth: 0

      - name: Verify existing custom glyph set
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("assets/minecraft/font/default.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          bitmaps=[x for x in data["providers"] if x.get("type")=="bitmap"]
          assert len(bitmaps)==58, len(bitmaps)
          assert any("\ue041" in "".join(x.get("chars",[])) for x in bitmaps), "U+E041 missing"
          Path("/tmp/bitmaps.json").write_text(json.dumps(bitmaps,ensure_ascii=False,sort_keys=True),encoding="utf-8")
          print("Existing custom bitmap providers:",len(bitmaps))
          PY

      - name: Install dedicated smooth regular and true bold fonts
        run: |
          mkdir -p assets/endernation/font docs
          cp assets/minecraft/font/font.ttf assets/endernation/font/lato-regular.ttf
          curl --fail --location --retry 3             https://raw.githubusercontent.com/google/fonts/main/ofl/lato/Lato-Bold.ttf             --output assets/endernation/font/lato-bold.ttf
          cp assets/minecraft/font/OFL-Lato.txt assets/endernation/font/OFL-Lato.txt

          cat > assets/endernation/font/regular.json <<'JSON'
          {
            "providers": [
              {
                "type": "ttf",
                "file": "endernation:lato-regular.ttf",
                "shift": [0, 0],
                "size": 8.5,
                "oversample": 20,
                "skip": ""
              },
              {
                "type": "reference",
                "id": "minecraft:default"
              }
            ]
          }
          JSON

          cat > assets/endernation/font/bold.json <<'JSON'
          {
            "providers": [
              {
                "type": "ttf",
                "file": "endernation:lato-bold.ttf",
                "shift": [0, 0],
                "size": 8.5,
                "oversample": 20,
                "skip": ""
              },
              {
                "type": "reference",
                "id": "minecraft:default"
              }
            ]
          }
          JSON

      - name: Verify Lato weights, glyphs and PUA isolation
        run: |
          python3 -m pip install --quiet fonttools
          python3 - <<'PY'
          from fontTools.ttLib import TTFont
          from pathlib import Path
          required={ord(c) for c in "MenuMenüÄÖÜäöüShop & Kits."}
          def inspect(path, expected_weight):
              font=TTFont(path)
              cmap={}
              for table in font["cmap"].tables:
                  if table.isUnicode():
                      cmap.update(table.cmap)
              missing=sorted(required-set(cmap))
              assert not missing, (path,missing)
              weight=font["OS/2"].usWeightClass
              assert weight==expected_weight,(path,weight)
              pua=[cp for cp in cmap if 0xE000<=cp<=0xF8FF]
              assert not pua,(path,pua[:10])
              names=font["name"].names
              fam=set()
              for n in names:
                  if n.nameID==1:
                      try: fam.add(n.toUnicode())
                      except: pass
              print(path,"weight",weight,"family",sorted(fam),"glyphs",len(cmap))
          inspect("assets/endernation/font/lato-regular.ttf",400)
          inspect("assets/endernation/font/lato-bold.ttf",700)
          PY

      - name: Write integration contract
        run: |
          cat > docs/TRUE-BOLD-26.3.md <<'DOC'
          # EnderNation true bold font contract (Minecraft Java 26.3)

          Resource-pack font IDs:
          - `endernation:regular` = Lato Regular 400
          - `endernation:bold` = Lato Bold 700

          Both fonts fall back to `minecraft:default` only for glyphs not present in Lato, which preserves the existing EnderNation private-use/UI bitmap glyphs.

          ## MiniMessage usage

          Normal:
          `<font:endernation:regular>Hier findest du Shop & Kits.</font>`

          True bold:
          `<font:endernation:bold>Menü</font>`

          Mixed:
          `<font:endernation:regular>Normal <font:endernation:bold>Fett</font> normal</font>`

          Do not add `<bold>` inside `endernation:bold`: the font file itself is already Bold 700. Leaving Minecraft synthetic bold enabled would reintroduce the double-stroke effect.

          ## Plugin output transformer contract

          Existing authoring syntax such as MiniMessage `<bold>` or legacy `&l` may remain as input, but before a component is sent/rendered the plugin must transform ordinary text styles:

          1. Traverse the Adventure component tree recursively while preserving the component type.
          2. Track inherited/effective `TextDecoration.BOLD` state (TRUE/FALSE/NOT_SET) and inherited font.
          3. For ordinary text using no explicit special font, `minecraft:default`, `endernation:regular`, or `endernation:bold`:
             - effective bold TRUE -> set font `endernation:bold`, set BOLD explicitly FALSE.
             - effective bold FALSE -> set font `endernation:regular`, keep/set BOLD FALSE.
          4. A child that explicitly resets bold must restore `endernation:regular`.
          5. Explicit non-text/special glyph fonts must not be replaced.
          6. Preserve colors, italic/underline/strikethrough/obfuscated states, insertion, click events, hover events, translatable keys and translatable arguments. Do not serialize to plain/legacy text and rebuild.
          7. Recurse into ordinary children and type-specific embedded components/arguments rather than flattening the component.

          The transformed render-ready component therefore uses a real Bold TTF with synthetic BOLD=false. This is an output adaptation layer, not a change to authoring syntax.

          ## Citizens boundary

          A Citizens name path that is stored/handled only as a legacy/String NPC name must not be assumed to preserve an Adventure font key. For those NPCs, use a component-capable hologram/display path or an integration that passes the Adventure Component to the final entity/name renderer. Verify the installed Citizens build/path before relying on MiniMessage font tags in an NPC name.

          ## Vanilla UI boundary

          Vanilla-owned bold UI strings still use Minecraft's synthetic bold on `minecraft:default`. A server resource pack cannot globally make vanilla `bold:true` automatically choose `endernation:bold`.
          DOC

      - name: Verify font definitions and unchanged bitmap providers
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          old=Path("/tmp/bitmaps.json").read_text(encoding="utf-8")
          default=json.loads(Path("assets/minecraft/font/default.json").read_text(encoding="utf-8"))
          now=json.dumps([x for x in default["providers"] if x.get("type")=="bitmap"],ensure_ascii=False,sort_keys=True)
          assert old==now,"minecraft:default bitmap providers changed"
          for name,weightfile in [("regular","lato-regular.ttf"),("bold","lato-bold.ttf")]:
              j=json.loads(Path(f"assets/endernation/font/{name}.json").read_text(encoding="utf-8"))
              assert j["providers"][0]["type"]=="ttf"
              assert j["providers"][0]["file"]==f"endernation:{weightfile}"
              assert j["providers"][1]=={"type":"reference","id":"minecraft:default"}
          print("Dedicated regular/bold font definitions OK; custom bitmaps untouched")
          PY

      - name: Commit true bold font structure to update-26.3 only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/endernation/font docs/TRUE-BOLD-26.3.md
          if git diff --cached --quiet; then
            echo "No true-bold changes to commit"
          else
            git commit -m "Add dedicated regular and true bold fonts for 26.3 [skip ci]"
            git push origin HEAD:refs/heads/update-26.3
          fi
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate and build complete Java pack
        run: python3 scripts/validate-and-build-java-pack.py

      - name: Verify complete pack structure
        run: |
          python3 - <<'PY'
          import json, zipfile
          z=zipfile.ZipFile("dist/EnderNation-Resource-Pack.zip")
          names=set(z.namelist())
          required={
            "pack.mcmeta",
            "assets/minecraft/font/default.json",
            "assets/minecraft/font/font.ttf",
            "assets/endernation/font/regular.json",
            "assets/endernation/font/bold.json",
            "assets/endernation/font/lato-regular.ttf",
            "assets/endernation/font/lato-bold.ttf",
            "assets/endernation/font/OFL-Lato.txt",
            "assets/minecraft/textures/font/enderguns/flashbang.png"
          }
          missing=sorted(required-names)
          assert not missing,missing
          mcmeta=json.loads(z.read("pack.mcmeta"))
          assert mcmeta["pack"]["max_format"]==[97,1],mcmeta
          print("Complete pack structure and 26.3 pack format OK")
          PY
          unzip -t dist/EnderNation-Resource-Pack.zip

      - name: Create cache-safe true-bold release assets
        run: |
          cp dist/EnderNation-Resource-Pack.zip dist/EnderNation-Resource-Pack-26.3-truebold-v1.zip
          cd dist
          sha1sum EnderNation-Resource-Pack-26.3-truebold-v1.zip > EnderNation-Resource-Pack-26.3-truebold-v1.zip.sha1
          sha256sum EnderNation-Resource-Pack-26.3-truebold-v1.zip > EnderNation-Resource-Pack-26.3-truebold-v1.zip.sha256
          cat EnderNation-Resource-Pack-26.3-truebold-v1.zip.sha1
          cat EnderNation-Resource-Pack-26.3-truebold-v1.zip.sha256

      - name: Mark previous smooth test superseded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view update-26.3-fontfix-smooth-lato-v1 >/dev/null 2>&1; then
            gh release edit update-26.3-fontfix-smooth-lato-v1               --title "SUPERSEDED – EnderNation 26.3 Smooth Lato Synthetic-Bold Test"               --prerelease               --notes "Superseded by the dedicated true-bold font build. This test retained Minecraft synthetic bold and did not solve the live double-stroke issue."
          fi

      - name: Publish true-bold release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="update-26.3-truebold-v1"
          git tag -f "$TAG" "$FINAL_SHA"
          git push --force origin "refs/tags/$TAG"
          NOTES="Minecraft Java 26.3 true-bold resource-pack build. Adds endernation:regular (Lato Regular 400) and endernation:bold (Lato Bold 700), each with fallback to the existing minecraft:default for missing/private-use glyphs. Existing 58 bitmap/UI providers and all item assets remain unchanged. Synthetic bold must be FALSE on components rendered with endernation:bold. Vanilla-owned bold UI remains limited by Minecraft synthetic bold. Built from update-26.3 at $FINAL_SHA."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "EnderNation Resource Pack 26.3 – True Bold v1" --notes "$NOTES"
          else
            gh release create "$TAG" --title "EnderNation Resource Pack 26.3 – True Bold v1" --notes "$NOTES" --latest=false
          fi
          gh release upload "$TAG"             dist/EnderNation-Resource-Pack-26.3-truebold-v1.zip             dist/EnderNation-Resource-Pack-26.3-truebold-v1.zip.sha1             dist/EnderNation-Resource-Pack-26.3-truebold-v1.zip.sha256             --clobber
