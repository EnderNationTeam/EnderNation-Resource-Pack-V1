name: Release 26.3 smooth fontfix Lato v1

on:
  push:
    branches:
      - update-26.3
    paths:
      - .github/workflows/release-fontfix-smooth-lato-v1.yml

permissions:
  contents: write

jobs:
  build-commit-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: update-26.3
          fetch-depth: 0

      - name: Preserve custom bitmap provider snapshot
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("assets/minecraft/font/default.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          bitmaps=[x for x in data["providers"] if x.get("type")=="bitmap"]
          Path("/tmp/bitmaps.json").write_text(json.dumps(bitmaps,ensure_ascii=False,sort_keys=True),encoding="utf-8")
          assert len(bitmaps)==58, len(bitmaps)
          print("Preserved",len(bitmaps),"bitmap providers")
          PY

      - name: Install smooth OFL font and restore TTF provider
        run: |
          curl --fail --location --retry 3             https://raw.githubusercontent.com/google/fonts/main/ofl/lato/Lato-Regular.ttf             --output assets/minecraft/font/font.ttf
          curl --fail --location --retry 3             https://raw.githubusercontent.com/google/fonts/main/ofl/lato/OFL.txt             --output assets/minecraft/font/OFL-Lato.txt

          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("assets/minecraft/font/default.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          bitmaps=[x for x in data["providers"] if x.get("type")=="bitmap"]
          provider={
            "type":"ttf",
            "file":"minecraft:font.ttf",
            "shift":[0,0],
            "size":8.5,
            "oversample":20,
            "skip":""
          }
          data["providers"]=[provider,*bitmaps]
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          old=Path("/tmp/bitmaps.json").read_text(encoding="utf-8")
          now=json.dumps(bitmaps,ensure_ascii=False,sort_keys=True)
          assert old==now, "Custom bitmap providers changed"
          assert len(bitmaps)==58
          assert any("\ue041" in "".join(x.get("chars",[])) for x in bitmaps), "U+E041 missing"
          raw=Path("assets/minecraft/font/font.ttf").read_bytes()
          assert len(raw)>100000, len(raw)
          assert raw[:4] in (b"\x00\x01\x00\x00", b"OTTO"), raw[:4]
          print("Smooth TTF installed; 58 custom bitmap providers unchanged")
          PY

      - name: Commit smooth font to update-26.3 only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/minecraft/font/default.json assets/minecraft/font/font.ttf assets/minecraft/font/OFL-Lato.txt
          if git diff --cached --quiet; then
            echo "No font changes to commit"
          else
            git commit -m "Use Lato Regular for clean smooth bold text in 26.3 [skip ci]"
            git push origin HEAD:refs/heads/update-26.3
          fi
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate and build complete Java pack
        run: python3 scripts/validate-and-build-java-pack.py

      - name: Verify final font and pack structure
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          data=json.loads(Path("assets/minecraft/font/default.json").read_text(encoding="utf-8"))
          ttf=[x for x in data["providers"] if x.get("type")=="ttf"]
          bitmaps=[x for x in data["providers"] if x.get("type")=="bitmap"]
          refs=[x for x in data["providers"] if x.get("type")=="reference"]
          assert ttf==[{"type":"ttf","file":"minecraft:font.ttf","shift":[0,0],"size":8.5,"oversample":20,"skip":""}],ttf
          assert len(bitmaps)==58
          assert not refs, refs
          assert any("\ue041" in "".join(x.get("chars",[])) for x in bitmaps)
          z=zipfile.ZipFile("dist/EnderNation-Resource-Pack.zip")
          names=set(z.namelist())
          assert "pack.mcmeta" in names
          assert "assets/minecraft/font/default.json" in names
          assert "assets/minecraft/font/font.ttf" in names
          assert "assets/minecraft/font/OFL-Lato.txt" in names
          assert "assets/minecraft/textures/font/enderguns/flashbang.png" in names
          print("Final smooth font and pack checks OK")
          PY
          unzip -t dist/EnderNation-Resource-Pack.zip

      - name: Create unique release asset and hashes
        run: |
          cp dist/EnderNation-Resource-Pack.zip dist/EnderNation-Resource-Pack-26.3-fontfix-smooth-lato-v1.zip
          cd dist
          sha1sum EnderNation-Resource-Pack-26.3-fontfix-smooth-lato-v1.zip > EnderNation-Resource-Pack-26.3-fontfix-smooth-lato-v1.zip.sha1
          sha256sum EnderNation-Resource-Pack-26.3-fontfix-smooth-lato-v1.zip > EnderNation-Resource-Pack-26.3-fontfix-smooth-lato-v1.zip.sha256
          cat EnderNation-Resource-Pack-26.3-fontfix-smooth-lato-v1.zip.sha1
          cat EnderNation-Resource-Pack-26.3-fontfix-smooth-lato-v1.zip.sha256

      - name: Mark pixel fallback release superseded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view update-26.3-fontfix-uniform-v1 >/dev/null 2>&1; then
            gh release edit update-26.3-fontfix-uniform-v1               --title "SUPERSEDED – EnderNation 26.3 Uniform Font Test"               --prerelease               --notes "Superseded test variant. Do not deploy as the preferred font release; user requested a smooth custom font instead."
          fi

      - name: Publish smooth font release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="update-26.3-fontfix-smooth-lato-v1"
          git tag -f "$TAG" "$FINAL_SHA"
          git push --force origin "refs/tags/$TAG"
          NOTES="Smooth custom-font variant for Minecraft Java 26.3. Uses Lato Regular 400 (SIL OFL 1.1) as the normal TTF basis while preserving all 58 existing bitmap/private-use providers unchanged. Minecraft bold remains synthetic; this build does not claim to disable bold offset. Built from update-26.3 at $FINAL_SHA."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "EnderNation Resource Pack 26.3 – Smooth Fontfix Lato v1" --notes "$NOTES"
          else
            gh release create "$TAG" --title "EnderNation Resource Pack 26.3 – Smooth Fontfix Lato v1" --notes "$NOTES" --latest=false
          fi
          gh release upload "$TAG"             dist/EnderNation-Resource-Pack-26.3-fontfix-smooth-lato-v1.zip             dist/EnderNation-Resource-Pack-26.3-fontfix-smooth-lato-v1.zip.sha1             dist/EnderNation-Resource-Pack-26.3-fontfix-smooth-lato-v1.zip.sha256             --clobber
